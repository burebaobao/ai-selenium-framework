[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results

markers =
    smoke: 冒烟测试
    regression: 回归测试
    ai_generated: AI 自动生成的测试用例
    healed: 经过自愈的用例
    flaky: 已知不稳定的用例

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
