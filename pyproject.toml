[project]
name = "ai-selenium-framework"
version = "1.0.0"
description = "AI + Selenium Web 前端自动化测试框架"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "selenium>=4.20",
    "webdriver-manager>=4.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
